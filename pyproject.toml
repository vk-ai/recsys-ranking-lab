[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-ranking-lab"
version = "0.1.0"
description = "Learning project: two-tower retrieval + learned re-ranker on MovieLens, with availability/diversity constraints, offline ranking metrics, a simulated A/B test and a PySpark feature job."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "torch>=2.2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
recsys-lab = "recsys_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs pyspark and a JVM (Java 17+)"]
filterwarnings = ["ignore:PySpark does not yet fully support pandas:FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
